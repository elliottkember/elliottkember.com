<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elliott Kember — Software Engineer</title>
<meta name="description" content="I design and build fast, high-quality software for the web and mobile — and care about the details people feel but never see.">
<meta property="og:title" content="Elliott Kember — Software Engineer">
<meta property="og:description" content="I design and build fast, high-quality software for the web and mobile — and care about the details people feel but never see.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#030305">
<link rel="canonical" href="https://elliottkember.com/">
<link rel="sitemap" href="/sitemap-index.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --mono: "JetBrains Mono", "Berkeley Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Inter", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    --hue: 200;
    --led: hsl(var(--hue) 100% 70%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #030305; color: #f2f2f4; overflow: hidden; }
  body { font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  a { color: inherit; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

  header {
    position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 24px clamp(20px, 3vw, 40px); pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .logo, footer span {
    background: rgba(3,3,5,.7); backdrop-filter: blur(10px); border-radius: 8px;
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; text-decoration: none; padding: 8px 14px; margin-left: -14px; }
  footer span { padding: 6px 10px; }
  .readout {
    display: flex; gap: 18px; align-items: center; padding: 8px 14px; border-radius: 8px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(10px);
  }
  .readout b { color: var(--led); font-weight: 500; text-shadow: 0 0 12px var(--led); }
  .readout i { width: 7px; height: 7px; border-radius: 50%; background: var(--led); box-shadow: 0 0 10px var(--led); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ----- Side rail: a quiet index; scroll/swipe moves between entries ----- */
  .rail {
    position: fixed; left: clamp(16px, 2.4vw, 36px); top: 50%; translate: 0 -50%; z-index: 2;
    display: flex; flex-direction: column; padding: 10px 6px; border-radius: 14px;
    background: rgba(3,3,5,.62); border: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .rail .thumb {
    position: absolute; left: 6px; top: 10px; width: 2px; height: 36px; border-radius: 2px;
    background: var(--led); box-shadow: 0 0 10px var(--led);
    transform: translateY(calc(var(--i, 0) * 36px)); transition: transform .5s cubic-bezier(.2,.8,.2,1), background .5s;
  }
  .rail button {
    all: unset; cursor: pointer; height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px;
    color: rgba(242,242,244,.45); transition: color .3s; white-space: nowrap;
  }
  .rail button span:first-child { font: 10px var(--mono); letter-spacing: .14em; width: 2ch; }
  .rail button span:last-child { font-size: 13.5px; font-weight: 500; }
  .rail button:hover, .rail button:focus-visible { color: rgba(242,242,244,.85); }
  .rail button.on { color: #fff; }
  .rail button.on span:first-child { color: var(--led); }

  /* ----- Foreground content ----- */
  main {
    position: fixed; right: clamp(20px, 5vw, 96px); top: 50%; translate: 0 -50%;
    width: min(560px, 48vw); z-index: 1;
  }
  .card {
    padding: clamp(24px, 3vw, 40px); border-radius: 18px;
    background: linear-gradient(180deg, rgba(8,8,12,.78), rgba(8,8,12,.62));
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 40px 120px -20px hsl(var(--hue) 90% 40% / .35);
  }
  .card .mono { color: var(--led); display: flex; justify-content: space-between; }
  .card h1 { font-size: clamp(40px, 5vw, 76px); letter-spacing: -0.045em; line-height: .95; margin: 20px 0 16px; font-weight: 600; }
  .card p { font-size: 17px; color: rgba(242,242,244,.75); max-width: 42ch; }
  .card h2 { font: 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(242,242,244,.45); margin: 26px 0 10px; font-weight: 400; }
  .card ol { list-style: none; display: grid; gap: 9px; }
  .card ol li { position: relative; padding-left: 20px; font-size: 15px; line-height: 1.45; color: rgba(242,242,244,.85); }
  .card ol li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--led); box-shadow: 0 0 8px var(--led); }
  .card .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 28px; }
  .card .next { all: unset; cursor: pointer; font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: rgba(242,242,244,.55); }
  .card .next:hover { color: #fff; }
  .card .next b { color: var(--led); font-weight: 400; }
  .card ul { list-style: none; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .card ul li { font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.06); }
  .card .go {
    display: inline-flex; gap: 10px; text-decoration: none; font-weight: 500;
    padding: 12px 18px; border-radius: 10px; background: var(--led); color: #050507;
    box-shadow: 0 0 30px -4px var(--led);
  }
  .card .links { display: flex; gap: 22px; margin-top: 28px; }
  .card .links a { text-decoration: none; border-bottom: 1px solid var(--led); padding-bottom: 2px; }

  footer {
    position: fixed; bottom: 22px; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 0 clamp(20px, 3vw, 40px); color: rgba(255,255,255,.6); pointer-events: none;
  }

  @media (max-width: 760px) {
    /* phone: rail tucks against the right edge as a column of numbers; only the current label shows */
    .rail { left: auto; right: 10px; top: 92px; translate: none; padding: 6px 4px; }
    .rail .thumb { left: 4px; top: 6px; height: 28px; transform: translateY(calc(var(--i, 0) * 28px)); }
    .rail button { height: 28px; padding: 0 8px 0 12px; }
    .rail button span:last-child { display: none; }
    main { top: auto; bottom: 14px; translate: none; width: auto; left: 12px; right: 12px; }
    .card { padding: 22px; max-height: 62vh; overflow: hidden; }
    .card h1 { font-size: 40px; margin: 14px 0 10px; }
    .card p { font-size: 15px; }
    .card h2 { margin: 16px 0 8px; }
    .card ol li { font-size: 13.5px; }
    .card ul { display: none; }
    .card .foot { margin-top: 18px; }
    .card .go { padding: 10px 14px; }
    .readout span { display: none; }
    footer { display: none; }
  }
</style>
</head>
<body>
<canvas id="leds"></canvas>

<header>
  <a class="logo" href="#" data-goto="0">Elliott Kember</a>
  <div class="readout mono"><i></i><span>CH</span><b id="ch">00</b><span>PROG</span><b id="prog">INTRO</b></div>
</header>

<nav class="rail" id="rail" aria-label="Projects"><i class="thumb"></i></nav>

<main><article class="card" id="card"></article></main>

<footer class="mono"><span>Scroll or ↑↓ to move · click the background</span><span id="engine"></span></footer>

<script type="module">
// ?v= busts copies browsers cached before the server sent no-cache headers
import { person, projects } from './shared/projects.js?v=12';
import { tilt } from './shared/tilt.js?v=12';

const stops = [
  { key: 'intro', label: 'Hello', hue: 200, prog: 'Mosaic' },
  ...projects.map((p) => ({ key: p.slug, label: p.title, hue: p.hue, project: p,
    prog: { openspace: 'Site walk', 'clearbit-x': 'Segments', soulmate: 'Metaballs', dropbox: 'Sync' }[p.slug] })),
  { key: 'contact', label: 'Contact', hue: 330, prog: 'Pulse' },
];

// ---------- Renderer: OffscreenCanvas in a worker if we can, main thread if we can't ----------
const canvas = document.getElementById('leds');
const dpr = Math.min(devicePixelRatio || 1, 2);
let send;
if (canvas.transferControlToOffscreen && typeof OffscreenCanvas !== 'undefined') {
  const off = canvas.transferControlToOffscreen();
  const worker = new Worker(new URL('./lumen/scene-worker.js?v=12', import.meta.url), { type: 'module' });
  worker.postMessage({ type: 'init', canvas: off, w: innerWidth, h: innerHeight, dpr, scene: 'intro', hue: 200 }, [off]);
  send = (msg) => worker.postMessage(msg);
  worker.onmessage = ({ data }) => data.navigate && navigateTo(data.navigate, data.x, data.y);
  document.getElementById('engine').textContent = 'OffscreenCanvas · worker thread';
} else {
  const { createHost } = await import('./lumen/scene-host.js?v=12');
  const host = createHost(canvas);
  host.resize(innerWidth, innerHeight, dpr);
  host.setScene('intro', 200);
  const start = performance.now(); let last = start;
  (function loop(now) { host.frame((now - start) / 1000, Math.min((now - last) / 1000, .05)); last = now; requestAnimationFrame(loop); })(start);
  send = (m) => ({
    resize: () => host.resize(m.w, m.h, m.dpr), scene: () => host.setScene(m.scene, m.hue, m.x, m.y),
    pointer: () => host.pointer(m.x, m.y, m.on),
    click: () => { const r = host.click(m.x, m.y); if (r?.navigate) navigateTo(r.navigate, m.x, m.y); }, tilt: () => host.tilt(m.x, m.y),
  })[m.type]();
  document.getElementById('engine').textContent = 'Canvas 2D · main thread';
}
addEventListener('resize', () => send({ type: 'resize', w: innerWidth, h: innerHeight, dpr }));
tilt((s) => send({ type: 'tilt', x: s.x, y: s.y }));
addEventListener('pointermove', (e) => send({ type: 'pointer', x: e.clientX, y: e.clientY, on: true }));
document.addEventListener('pointerleave', () => send({ type: 'pointer', x: -999, y: -999, on: false }));
// background taps (not swipes): pointerdown → pointerup without much movement
let press = null;
addEventListener('pointerdown', (e) => { press = e.target.closest('a, button, .card, .rail') ? null : { x: e.clientX, y: e.clientY, at: performance.now() }; });
addEventListener('pointerup', (e) => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 12 && performance.now() - press.at < 600) send({ type: 'click', x: e.clientX, y: e.clientY });
  press = null;
});
// the home mosaic asks to open a project when one of its cells is tapped
function navigateTo(key, x, y) { const i = stops.findIndex((s) => s.key === key); if (i >= 0) go(i, { origin: { x, y } }); }

// ---------- Side rail ----------
const rail = document.getElementById('rail');
const buttons = stops.map((s, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span>${String(i).padStart(2, '0')}</span><span>${s.label}</span>`;
  b.addEventListener('click', (e) => go(i, { origin: pointOf(e) }));
  rail.append(b);
  return b;
});
let active = -1;

// origin: { x, y } in css px for the background reveal to grow from (a tap, a lifted finger, the cursor)
function go(i, { instant = false, origin } = {}) {
  i = Math.max(0, Math.min(stops.length - 1, i));
  if (i === active) return;
  const dir = i < active ? -1 : 1;
  active = i;
  rail.style.setProperty('--i', i);
  const s = stops[i];
  buttons.forEach((b, j) => { b.classList.toggle('on', j === i); b.toggleAttribute('aria-current', j === i); });
  document.documentElement.style.setProperty('--hue', s.hue);
  document.getElementById('ch').textContent = String(i).padStart(2, '0');
  document.getElementById('prog').textContent = s.prog.toUpperCase();
  send({ type: 'scene', scene: s.key, hue: s.hue, x: origin?.x, y: origin?.y });
  history.replaceState(null, '', `#${s.key}`);
  const html = cardFor(s, i);
  if (instant) document.getElementById('card').innerHTML = html;
  else swapCard(html, dir);
}

// Keyboard-triggered clicks report (0, 0) with detail 0 — no real point, so use the default origin.
const pointOf = (e) => (e.detail === 0 && e.type === 'click') ? undefined : { x: e.clientX, y: e.clientY };

// Card swap: slide out the way you're moving, replace, slide in. Plain Web Animations rather than
// View Transitions — iOS Safari mis-positions the snapshot of a backdrop-filtered element.
// Opacity + transform only: a CSS filter on the card would break its backdrop blur in Safari.
let swapToken = 0;
async function swapCard(html, dir) {
  const card = document.getElementById('card'), token = ++swapToken;
  card.getAnimations().forEach((a) => a.cancel());
  const out = card.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateY(${-dir * 36}px)` }],
    { duration: 180, easing: 'ease-in', fill: 'forwards' });
  try { await out.finished; } catch { return; }
  if (token !== swapToken) return; // a newer swap took over
  card.innerHTML = html;
  out.cancel();
  card.animate([{ opacity: 0, transform: `translateY(${dir * 44}px)` }, { opacity: 1, transform: 'none' }],
    { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

const coarse = matchMedia('(pointer: coarse)').matches;
function cardFor(s, i) {
  const ch = `<div class="mono"><span>${String(i).padStart(2, '0')} / ${String(stops.length - 1).padStart(2, '0')}</span><span>${s.project?.years ?? ''}</span></div>`;
  const nextStop = stops[i + 1];
  const next = nextStop ? `<button class="next" data-next>${coarse ? 'Swipe' : 'Next'} <b>↓</b> ${nextStop.label}</button>` : `<button class="next" data-first>Back to top <b>↑</b></button>`;
  if (s.key === 'intro') return `${ch}
    <h1>${person.name}</h1>
    <p>${person.tagline}</p>
    <ul><li>${person.role}</li><li>${person.location}</li></ul>
    <div class="foot"><span></span>${next}</div>`;
  if (s.key === 'contact') return `${ch}
    <h1>Say hello.</h1>
    <p>${person.bio}</p>
    <div class="links">${person.links.map((l) => `<a href="${l.href}">${l.label}</a>`).join('')}<a href="/about">About</a></div>
    <div class="foot"><span></span>${next}</div>`;
  const p = s.project;
  return `${ch}
    <h1>${p.title}</h1>
    <p>${p.blurb}</p>
    ${p.did?.length ? `<h2>What I did</h2>
    <ol>${p.did.map((d) => `<li>${d}</li>`).join('')}</ol>` : ''}
    <ul>${p.tags.map((t) => `<li>${t}</li>`).join('')}</ul>
    <div class="foot"><span></span>${next}</div>`;
}
document.getElementById('card').addEventListener('click', (e) => {
  if (e.target.closest('[data-next]')) go(active + 1, { origin: pointOf(e) });
  else if (e.target.closest('[data-first]')) go(0, { origin: pointOf(e) });
});

// wheel: one step per gesture. A trackpad flick keeps firing momentum events for a second or more,
// so after stepping we ignore the wheel until it has been quiet for a moment.
let acc = 0, wheelLocked = false, quiet;
addEventListener('wheel', (e) => {
  clearTimeout(quiet);
  quiet = setTimeout(() => { wheelLocked = false; acc = 0; }, 220);
  if (wheelLocked) return;
  acc += e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1); // lines/pages → px
  if (Math.abs(acc) > 30) {
    go(active + Math.sign(acc), { origin: pointOf(e) });
    wheelLocked = true; acc = 0;
  }
}, { passive: true });

// swipe up/down anywhere to move between entries
let touch0 = null;
addEventListener('touchstart', (e) => { const t = e.touches[0]; touch0 = { x: t.clientX, y: t.clientY, at: performance.now() }; }, { passive: true });
addEventListener('touchend', (e) => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.3 && performance.now() - touch0.at < 800) go(active + (dy < 0 ? 1 : -1), { origin: { x: t.clientX, y: t.clientY } });
  touch0 = null;
}, { passive: true });
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false }); // no rubber-band scrolling

addEventListener('keydown', (e) => {
  if (['ArrowDown', 'ArrowRight', 'j'].includes(e.key)) go(active + 1);
  else if (['ArrowUp', 'ArrowLeft', 'k'].includes(e.key)) go(active - 1);
  else if (/^[0-5]$/.test(e.key)) go(+e.key);
  else return;
  e.preventDefault();
});
document.querySelectorAll('[data-goto]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(+a.dataset.goto); }));

addEventListener('hashchange', () => {
  const i = stops.findIndex((s) => s.key === location.hash.slice(1));
  if (i >= 0) go(i);
});
const fromHash = stops.findIndex((s) => s.key === location.hash.slice(1));
go(fromHash < 0 ? 0 : fromHash, { instant: true });
</script>
</body>
</html>
