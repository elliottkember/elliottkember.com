  <script type="text/javascript">
    let hue = Math.random() * 255;
    const difference = 80;
    const s = "100%";
    const l = "80%";
    const a = document.querySelectorAll('a');
    const path = document.querySelectorAll('path');
    setInterval(function() {
      hue += 0.1;
      let first = `hsl(${hue}, ${s}, ${l})`;
      let second = `hsl(${hue + difference}, ${s}, ${l})`;
      const logo = `hsl(${hue + difference - 45}, 80%, 70%)`;
      document.body.style.background =
        "linear-gradient(to bottom right, " + first + ", " + second + ")";
      a.forEach(a => { a.style.color = second; });
      path.forEach(path => { path.style.fill = logo; });
    }, 5);
  </script>
