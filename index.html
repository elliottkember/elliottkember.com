      }
      #overlay-wrapper {
        flex-shrink: 0;
        margin-bottom: 10px;

        border-radius: 50%;

        height: 240px;
        box-sizing: border-box;
      }
      #overlay {
        opacity: 0.4;
        border: none;
        position: absolute;
        width: 100%;
        height: 100%;
        width: 240px;
        height: 240px;
      }
      #me {
        background-image: url('me.jpg');
        background-size: 100% 100%;
      }
      @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
        #me {
          background-image: url('me2x.jpg');
        }
      }
      @media (-webkit-min-device-pixel-ratio: 3), (min-resolution: 288dpi) {
        #me {
          background-image: url('me3x.jpg');
        }
      }
      #card-overlay {
        background: white;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 1;
        content: '';
        opacity: 0;

        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: center center;
      }
      #overlay-wrapper {
        transition: linear transform 0.2s;
      }

        perspective: 400px;

  <script type="text/javascript">

    const cardOverlay = document.getElementById('card-overlay');
    const card = document.getElementById('card');
    const me = document.getElementById('overlay-wrapper');

    document.addEventListener('mousemove', function(e){
      const x = e.clientX;
      const y = e.clientY;
      const boxX = card.offsetLeft;
      const boxY = card.offsetTop;
      const left = boxX - x;
      const top = boxY - y;
      const k = 100;
      const transform = `rotateX(${top/k}deg) rotateY(${left/-k}deg)`;
      card.style.transform = transform;
      me.style.transform = `rotateX(${top/k}deg) rotateY(${left/-k}deg)`;
      cardOverlay.style.opacity = top/k * 0.2 ;
    });

    var deg = 100;
    var hue = Math.random() * 255;
    const s = "100%";
    const l = "80%";
    const difference = 80;
    const a = document.querySelectorAll('a');
    const svg = document.querySelector('svg');
    const path = document.querySelectorAll('path');
    let change = 1;
    let changeUp = true;
    let f = document.getElementById('favicon');
    let overlayWrapper = document.getElementById('overlay-wrapper');
    var canvas = document.createElement('canvas');
    canvas.width = 16;
    canvas.height = 16;
    var ctx = canvas.getContext('2d');
    var img = new Image();
    var grd = ctx.createLinearGradient(0, 0, 16, 16);

    let first = 'white';
    let second = 'white';

    const changeMultiplier = 3;

    setInterval(function() {
      hue += change;
      deg += change;

      if (changeUp) {
        change += 0.001 * changeMultiplier;
        if (change > 1.5 * changeMultiplier) {
          changeUp = false;
        }
      } else {
        change -= 0.001  * changeMultiplier;
        if (change < -1.5 * changeMultiplier) {
          changeUp = true;
        }
      }

      const sin = Math.abs(Math.sin(deg/180*Math.PI));
      const cos = Math.abs(Math.cos(deg/180*Math.PI));

      first = `hsl(${hue}, ${s}, ${l})`;
      second = `hsl(${hue + difference}, ${s}, ${l})`;

      const logo = `hsl(${hue + difference - 90}, ${s}, ${l})`;
      const logoSecond = `hsl(${hue - 90}, ${s}, ${l})`;

      document.body.style.background =
        "linear-gradient(" + deg + "deg, " + first + ", " + second + ")";

      document.body.style.boxShadow = `
        ${cos}px ${sin}px ${sin * 100}px ${first} inset,
        ${cos}px ${sin}px ${cos * 100}px ${second} inset
      `;

      card.style.boxShadow = `
        ${cos}px ${sin}px 100px ${second},
        ${cos}px ${sin}px 100px ${first}
      `;

      overlay.style.background =
        "linear-gradient(" + deg + "deg, " + logo + ", " + logoSecond + ")";

      overlayWrapper.style.boxShadow = `
        ${cos}px ${sin}px ${sin * 20}px ${first},
        ${cos}px ${sin}px ${cos * 20}px ${second}
      `;

      texture1.style.backgroundPosition = `${change * 100}px ${change * 100}px`;
      texture1.style.opacity = cos * 0.4;

      a.forEach(a => { a.style.color = second; });
      path.forEach(path => { path.style.fill = logo; });
      grd.addColorStop(0, first);
      grd.addColorStop(1, second);
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 16 + cos * 16, 16 + sin * 16);
      var link = document.createElement('link');
      link.type = 'image/x-icon';
      link.rel = 'shortcut icon';
      link.href = canvas.toDataURL("image/x-icon");
      f.parentElement.removeChild(f);
      document.getElementsByTagName('head')[0].appendChild(link);
      f = link;
    }, 20);
  </script>
